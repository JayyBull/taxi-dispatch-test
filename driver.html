<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver App</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef3f8;margin:0;color:#162638}.wrap{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 18px #0002;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:7px 10px;border-radius:999px;background:#e7edf4;font-size:12px;font-weight:900}.pill.on{background:#dcfce7;color:#166534}.route{background:#f3f7fb;padding:12px;border-radius:8px;line-height:1.55;margin:10px 0}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.meta div{text-align:center;border:1px solid #d5dee7;border-radius:7px;padding:9px}.meta small{display:block;color:#66788a;font-size:10px}.count{font-size:26px;font-weight:900;color:#d97706}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions.one{grid-template-columns:1fr}.actions button,.availability button{min-height:48px;border:0;border-radius:8px;font-weight:900;font-size:15px;cursor:pointer}.yes,.primary{background:#16803c;color:#fff}.no{background:#d92d20;color:#fff}.blue{background:#0b5db7;color:#fff}.amber{background:#d97706;color:#fff}.purple{background:#7e22ce;color:#fff}.dark{background:#26384b;color:#fff}.availability{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.availability .off{background:#64748b;color:#fff}input{width:100%;height:44px;padding:8px;border:1px solid #bbc7d3;border-radius:7px;margin:8px 0}.status{text-align:center;color:#66788a;margin:10px}.hidden{display:none}.jobstatus{font-size:12px;font-weight:900;color:#0b5db7;text-transform:uppercase}.complete{background:#16803c;color:#fff}.error{color:#b42318;font-weight:700}</style></head><body><div class="wrap">
<div class="card" id="login"><h2>Driver Login</h2><label>Callsign</label><input id="call" autocomplete="username" placeholder="e.g. 101"><label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="Driver PIN"><button class="blue" style="width:100%;height:46px;border:0;border-radius:8px;font-weight:900" onclick="loginDriver()">LOGIN</button><div class="status" id="loginStatus">Not connected</div></div>
<div class="card hidden" id="driverHome"><div class="top"><div><b id="driverName">Driver</b><div class="jobstatus" id="connectionState">CONNECTED</div></div><span class="pill" id="availabilityPill">OFFLINE</span></div><div class="availability"><button class="primary" onclick="setAvailability('Available')">AVAILABLE</button><button class="off" onclick="setAvailability('Offline')">OFFLINE</button></div><button class="dark" style="width:100%;height:42px;border:0;border-radius:8px;margin-top:8px;font-weight:900" onclick="logoutDriver()">LOG OUT</button></div>
<div class="card hidden" id="offer"><div class="top"><h2 style="margin:0">New Booking Offer</h2><b id="ref"></b></div><div class="route"><b>Pickup:</b> <span id="pickup"></span><br><b>Destination:</b> <span id="dest"></span></div><div class="meta"><div><small>PICKUP</small><b id="ptime"></b></div><div><small>FARE</small><b id="fare"></b></div><div><small>ACCEPT IN</small><span class="count" id="count"></span></div></div><div class="actions"><button class="yes" onclick="respondOffer('accept')">✓ ACCEPT</button><button class="no" onclick="respondOffer('decline')">✕ DECLINE</button></div><div class="status" id="offerDetail"></div></div>
<div class="card hidden" id="currentJob"><div class="top"><h2 style="margin:0">Current Job</h2><span class="pill on" id="jobStatus">ASSIGNED</span></div><div class="route"><b id="jobRef"></b><br><b>Pickup:</b> <span id="jobPickup"></span><br><b>Destination:</b> <span id="jobDest"></span></div><div class="meta"><div><small>PICKUP</small><b id="jobTime"></b></div><div><small>FARE</small><b id="jobFare"></b></div><div><small>STATUS</small><b id="jobStatusText"></b></div></div><div id="jobActions" class="actions one"></div><div class="status" id="jobMessage"></div></div>
</div><script>
let es,currentOffer,currentJobData,timer,authenticatedDriver=null;const backend=location.origin;const statusFlow={Assigned:['En Route','START / EN ROUTE','blue'], 'En Route':['Arrived','ARRIVED','amber'], Arrived:['Passenger On Board','PASSENGER ON BOARD','purple'], 'Passenger On Board':['Completed','COMPLETE JOB','complete']};
async function api(path,payload,method='POST'){let r=await fetch(backend+path,{method,credentials:'include',headers:{'Content-Type':'application/json'},body:method==='GET'?undefined:JSON.stringify(payload||{})});let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function loginDriver(){let call=document.getElementById('call').value.trim(),pin=document.getElementById('pin').value.trim();if(!call||!pin){loginStatus.textContent='Enter your callsign and PIN';return}try{loginStatus.textContent='Signing in…';let x=await api('/api/driver/login',{callsign:call,pin});authenticatedDriver=x;document.getElementById('pin').value='';openDriverSession()}catch(e){loginStatus.textContent=e.message;loginStatus.className='status error'}}
async function restoreSession(){try{let x=await api('/api/driver/me',null,'GET');authenticatedDriver=x;document.getElementById('call').value=x.callsign;openDriverSession(x);(x.jobs||[]).forEach(showJob)}catch(e){}}
function openDriverSession(me){if(es)es.close();document.getElementById('login').classList.add('hidden');document.getElementById('driverHome').classList.remove('hidden');document.getElementById('driverName').textContent=(me?.name||authenticatedDriver?.name||'Driver')+' · '+(me?.callsign||authenticatedDriver?.callsign||'');document.getElementById('connectionState').textContent='CONNECTING';es=new EventSource(backend+'/api/driver/events',{withCredentials:true});es.onopen=()=>{connectionState.textContent='CONNECTED';loginStatus.textContent='Authenticated'};es.addEventListener('offer',e=>showOffer(JSON.parse(e.data)));es.addEventListener('offer-closed',e=>{let x=JSON.parse(e.data);if(currentOffer&&currentOffer.booking_ref===x.booking_ref){hideOffer();loginStatus.textContent='Offer '+x.reason}});es.addEventListener('job-assigned',e=>showJob(JSON.parse(e.data)));es.addEventListener('job-status',e=>showJob(JSON.parse(e.data)));es.addEventListener('job-closed',e=>{let x=JSON.parse(e.data);if(currentJobData&&currentJobData.booking_ref===x.booking_ref){currentJobData=null;currentJob.classList.add('hidden');setAvailability('Available')}});es.onerror=()=>connectionState.textContent='RECONNECTING';if(me?.status){let p=availabilityPill;p.textContent=me.status.toUpperCase();p.className='pill'+(me.status==='Available'?' on':'')}else setAvailability('Available')}
async function logoutDriver(){try{await api('/api/driver/logout',{})}catch(e){}if(es)es.close();authenticatedDriver=null;currentJobData=null;hideOffer();driverHome.classList.add('hidden');currentJob.classList.add('hidden');login.classList.remove('hidden');loginStatus.textContent='Logged out';loginStatus.className='status'}
async function setAvailability(st){try{await api('/api/driver/status',{status:st});let p=availabilityPill;p.textContent=st.toUpperCase();p.className='pill'+(st==='Available'?' on':'')}catch(e){loginStatus.textContent=e.message}}
function showOffer(x){currentOffer=x;offer.classList.remove('hidden');ref.textContent='#'+x.booking_ref;pickup.textContent=x.pickup;dest.textContent=x.destination;ptime.textContent=x.pickup_time;fare.textContent='£'+Number(x.fare||0).toFixed(2);offerDetail.textContent='Rank #'+x.rank+' · '+Number(x.pickup_distance_miles||0).toFixed(1)+' mi from pickup';tick();clearInterval(timer);timer=setInterval(tick,250)}
function hideOffer(){offer.classList.add('hidden');currentOffer=null;clearInterval(timer)}function tick(){if(!currentOffer)return;let s=Math.max(0,Math.ceil(currentOffer.expires_at-Date.now()/1000));count.textContent=s+'s';if(!s)hideOffer()}
async function respondOffer(action){if(!currentOffer)return;try{let r=currentOffer.booking_ref;await api('/api/offers/'+encodeURIComponent(r)+'/respond',{action});hideOffer();loginStatus.textContent=action==='accept'?'Booking accepted':'Booking declined'}catch(e){offerDetail.textContent=e.message;offerDetail.className='status error'}}
function showJob(x){currentJobData=x;currentJob.classList.remove('hidden');jobRef.textContent='#'+x.booking_ref;jobPickup.textContent=x.pickup||'';jobDest.textContent=x.destination||'';jobTime.textContent=x.pickup_time||'';jobFare.textContent='£'+Number(x.fare||0).toFixed(2);jobStatus.textContent=(x.status||'Assigned').toUpperCase();jobStatusText.textContent=x.status||'Assigned';let f=statusFlow[x.status],a=jobActions;a.innerHTML=f?`<button class="${f[2]}" onclick="advanceJob('${f[0]}')">${f[1]}</button>`:'';if(x.status==='Completed'){a.innerHTML='';jobMessage.textContent='Job completed successfully.'}}
async function advanceJob(next){if(!currentJobData)return;try{let j=await api('/api/jobs/'+encodeURIComponent(currentJobData.booking_ref)+'/status',{status:next});showJob(j.job)}catch(e){jobMessage.textContent=e.message;jobMessage.className='status error'}}
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')loginDriver()});restoreSession();
</script></body></html>
